name: CI

on:
  push:
    branches: [Stagging, main]
  pull_request:
    branches: [Stagging, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      HOST: localhost
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ci_dummy_app_key_not_used_in_prod_32c
      APP_URL: http://localhost:3333
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Not a secret — just the project URL, used to fetch Supabase's public JWKS.
      SUPABASE_URL: https://phqndaixlhpuxriioald.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
